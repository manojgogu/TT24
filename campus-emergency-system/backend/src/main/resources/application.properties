# ============================================================
# Campus Emergency Reporting and Response Management System
# Backend Configuration
# ============================================================

server.port=8080

# Spring Application Name
spring.application.name=campus-emergency-backend

# Database Configuration (MySQL 8+)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_emergency_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Custom File Storage Directory
app.upload.dir=${UPLOAD_DIR:uploads/emergency-attachments}

# JWT Security Settings (HMAC SHA-256 Secret minimum 256 bits)
app.jwt.secret=${JWT_SECRET:CampusEmergencySecureJwtSecretKeyMustBeAtLeast256BitsLongForHS256Algorithm}
app.jwt.expiration-ms=86400000

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Logging Configuration
logging.level.com.campus.emergency=INFO
logging.level.org.springframework.security=WARN
